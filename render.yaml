# Bring the Historify API online in one step.
#
# Render reads this blueprint and creates both the web service and its
# database, wired together. Nothing here holds a secret: JWT_SECRET and
# CSRF_SECRET are generated by Render itself, and DATABASE_URL is injected from
# the database it provisions. The only value a human types is CORS_ORIGIN.
#
# How to use it:
#   1. Push this file (it is already on the branch).
#   2. render.com → New → Blueprint → pick this repository.
#   3. Set CORS_ORIGIN to your Netlify URL, e.g. https://historify.netlify.app
#      (comma-separated if you have more than one — no trailing slash).
#   4. Deploy. Copy the service URL Render gives you.
#   5. In Netlify, set VITE_API_URL to that URL and redeploy the front end.
#
# The server refuses to start on a weak configuration — see
# server/src/security/bootChecks.ts. `generateValue: true` produces a random
# secret that satisfies it; typing your own short one will (correctly) fail the
# boot rather than silently run on a guessable signing key.

databases:
  - name: historify-db
    databaseName: historify
    plan: free
    # Render's managed Postgres enforces TLS on external connections and
    # supplies a connection string with sslmode=require already set, which the
    # boot check verifies rather than assumes.

services:
  - type: web
    name: historify-api
    runtime: node
    plan: free
    rootDir: server
    # `prisma db push` rather than `migrate deploy`: this schema has no
    # migration history, so push is the honest command for it. Swap to
    # `prisma migrate deploy` the moment you start generating migrations —
    # push is destructive to columns it does not know about.
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: historify-db
          property: connectionString
      # Generated by Render, never seen by anyone, different for each.
      # Two independent values so rotating one does not force the other.
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # The ONE value you must fill in: where the browser app is served from.
      # Credentialed CORS cannot use "*", so this has to be the real origin.
      - key: CORS_ORIGIN
        sync: false
      # Optional. Leave unset unless you are wiring up payments.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
